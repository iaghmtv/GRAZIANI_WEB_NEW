name: Publicar "02 SITIO NUEVO" en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true   # habilita Pages en el repo si todavía no lo está
      - name: Empaquetar la carpeta del sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: "02 SITIO NUEVO"
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
